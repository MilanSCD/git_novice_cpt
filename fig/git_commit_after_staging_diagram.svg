<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1024" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1900" height="1024" fill="#f7f7f9"/>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- commit arrows -->
  <line x1="290" y1="658" x2="480" y2="658" stroke="#374151" stroke-width="5" marker-end="url(#arrow-dark)"/>
  <line x1="665" y1="658" x2="845" y2="658" stroke="#374151" stroke-width="5" marker-end="url(#arrow-dark)"/>
  <line x1="1030" y1="658" x2="1210" y2="658" stroke="#374151" stroke-width="5" marker-end="url(#arrow-dark)"/>

  <!-- staged changes are now committed: solid arrow into the new commit -->
  <line x1="1400" y1="658" x2="1665" y2="658" stroke="#374151" stroke-width="5" marker-end="url(#arrow-dark)"/>

  <!-- commit circles -->
  <g text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">
    <circle cx="200" cy="658" r="90" fill="#d9e9fb" stroke="#2f6fde" stroke-width="5"/>
    <text x="200" y="670">C1</text>

    <circle cx="575" cy="658" r="90" fill="#d9e9fb" stroke="#2f6fde" stroke-width="5"/>
    <text x="575" y="670">C2</text>

    <circle cx="940" cy="658" r="90" fill="#d9e9fb" stroke="#2f6fde" stroke-width="5"/>
    <text x="940" y="670">C3</text>

    <circle cx="1310" cy="658" r="90" fill="#d9e9fb" stroke="#2f6fde" stroke-width="5"/>
    <text x="1310" y="670">C4</text>

    <!-- the staging area is now part of history as a real commit -->
    <circle cx="1760" cy="658" r="90" fill="#d9e9fb" stroke="#2f6fde" stroke-width="5"/>
    <text x="1760" y="670">C5</text>
  </g>

  <!-- commit captions -->
  <g text-anchor="middle" font-size="28" fill="#374151">
    <text x="200" y="800">(initial commit)</text>
    <text x="1760" y="800">(latest commit)</text>
  </g>

  <!-- HEAD -> main -> C5 arrows: both labels move forward to the new commit -->
  <line x1="1760" y1="200" x2="1760" y2="305" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <line x1="1760" y1="420" x2="1760" y2="555" stroke="#16a34a" stroke-width="5" marker-end="url(#arrow-green)"/>

  <!-- HEAD box -->
  <rect x="1645" y="98" width="230" height="90" rx="14" fill="#f5f0ff" stroke="#7c3aed" stroke-width="4"/>
  <text x="1760" y="153" text-anchor="middle" font-size="34" font-weight="700" fill="#5b21b6">HEAD</text>

  <!-- main box -->
  <rect x="1645" y="325" width="230" height="90" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
  <text x="1760" y="380" text-anchor="middle" font-size="34" font-weight="700" fill="#15803d">main</text>
</svg>
